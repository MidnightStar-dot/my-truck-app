name: Android Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 kivy

      - name: Build with Buildozer
        run: |
          [ -d my-truck-app ] && cd my-truck-app
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          
          # Даем права на запуск Gradle (исправляет твою ошибку)
          mkdir -p .buildozer/android/platform/build-arm64-v8a/dists/myapp
          chmod +x .buildozer/android/platform/build-arm64-v8a/dists/myapp/gradlew || true
          
          # Принимаем лицензии и строим
          yes | buildozer -v android debug
        env:
          APP_ANDROID_ARCHS: "arm64-v8a"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TruckApp
          path: bin/*.apk
