name: Android Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev libffi-dev libssl-dev
          pip3 install --upgrade pip
          pip3 install buildozer cython kivy

      - name: Build with Buildozer
        run: |
          # Если файла нет, создаем стандартный (на всякий случай)
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          
          # Запуск сборки
          yes | buildozer -v android debug
        env:
          APP_ANDROID_ARCHS: "arm64-v8a"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TruckLog-APK
          path: bin/*.apk
