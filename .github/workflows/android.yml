name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev python3-dev libssl-dev zip unzip
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" "cython<3.0"

      - name: Build APK
        run: |
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          
          # 1. ФИКС ЛИЦЕНЗИЙ (Создаем нужные папки заранее)
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg
          
          # 2. Настройка библиотек и разрешений
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy==2.3.0,kivymd,pillow,openpyxl/' buildozer.spec
          sed -i 's/#android.permissions =/android.permissions = WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE,MANAGE_EXTERNAL_STORAGE/' buildozer.spec
          
          # 3. ФИКС ВЕРСИЙ (Уходим от проблемной 37-rc2 к стабильной 34)
          sed -i 's/#android.api = 31/android.api = 34/' buildozer.spec
          sed -i 's/#android.build_tools_version =/android.build_tools_version = 34.0.0/' buildozer.spec
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          
          # 4. ПРИНУДИТЕЛЬНОЕ ПРИНЯТИЕ ВСЕХ ЛИЦЕНЗИЙ
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # 5. Сборка
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: truck-log-apk
          path: bin/*.apk
