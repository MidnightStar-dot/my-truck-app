name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev python3-dev libssl-dev zip unzip
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" "cython<3.0"

      - name: Build APK
        run: |
          # 1. Инициализация и жесткая правка конфига
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          
          # Удаляем стандартные строки и вставляем свои, чтобы он не лез в 37-rc2
          sed -i 's/^requirements = .*/requirements = python3,kivy==2.3.0,kivymd,pillow,openpyxl/' buildozer.spec
          sed -i 's/^# android.api = .*/android.api = 34/' buildozer.spec
          sed -i 's/^# android.ndk = .*/android.ndk = 25b/' buildozer.spec
          sed -i 's/^# android.build_tools_version = .*/android.build_tools_version = 34.0.0/' buildozer.spec
          sed -i 's/^# android.accept_sdk_license = .*/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/^android.permissions = .*/android.permissions = WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE,MANAGE_EXTERNAL_STORAGE/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = trucklogapp/' buildozer.spec

          # 2. ПРИНУДИТЕЛЬНОЕ ПРИНЯТИЕ ЛИЦЕНЗИЙ
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # 3. СБОРКА С ЛОГОМ (чтобы видеть детали, если упадет)
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: truck-log-apk
          path: bin/*.apk
