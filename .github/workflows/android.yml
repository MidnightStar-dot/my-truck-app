name: Android Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 kivy

      - name: Build APK
        run: |
          # Если файла настроек нет, создаем его
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          
          # Настраиваем имя и зависимости прямо в файле
          sed -i 's/package.name = myapp/package.name = truckapp/' buildozer.spec
          sed -i 's/title = My Application/title = Truck Log/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,pillow/' buildozer.spec
          
          # Принимаем лицензии и собираем
          yes | buildozer -v android debug
        env:
          APP_ANDROID_ARCHS: "arm64-v8a"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Final-Truck-App
          path: bin/*.apk
