name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev python3-dev libssl-dev zip unzip
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" "cython<3.0"

      - name: Build APK
        run: |
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          
          # 1. ЖЕСТКОЕ ПРИНЯТИЕ ЛИЦЕНЗИЙ И УСТАНОВКА НУЖНОЙ ВЕРСИИ
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          # 2. ПРАВИМ SPECS: ЗАПРЕЩАЕМ АВТОМАТИКУ
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy==2.3.0,kivymd,pillow,openpyxl/' buildozer.spec
          sed -i 's/#android.permissions =/android.permissions = WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE,MANAGE_EXTERNAL_STORAGE/' buildozer.spec
          
          # Указываем явно использовать 34 версию и ПРИНИМАТЬ лицензии
          sed -i 's/android.api = 31/android.api = 34/' buildozer.spec
          sed -i 's/#android.build_tools_version =/android.build_tools_version = 34.0.0/' buildozer.spec
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          
          # 3. ХАК ДЛЯ AIDL (создаем ссылку, чтобы билд его нашел)
          mkdir -p .buildozer/android/platform/android-sdk/build-tools/
          ln -s $ANDROID_HOME/build-tools/34.0.0 .buildozer/android/platform/android-sdk/build-tools/34.0.0 || true

          # 4. ЗАПУСК
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: truck-log-apk
          path: bin/*.apk
