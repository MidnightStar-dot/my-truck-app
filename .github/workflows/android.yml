- name: Build APK
        run: |
          # Переходим в папку, если она создалась внутри
          [ -d my-truck-app ] && cd my-truck-app
          # Запускаем сборку без лишних вопросов
          buildozer android debug
        env:
          APP_ANDROID_ARCHS: "arm64-v8a"
          ACCEPT_SDK_LICENSE: "y"
