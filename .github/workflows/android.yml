name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libffi-dev python3-dev libssl-dev \
            zip unzip git autoconf libtool pkg-config \
            libltdl-dev zlib1g-dev
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" "cython<3.0"

      - name: Initialise and patch buildozer.spec
        run: |
          [ -f buildozer.spec ] || buildozer init
          patch_spec() {
            key="$1" val="$2"
            if grep -qE "^${key}\s*=" buildozer.spec; then
              sed -i "s|^${key}\s*=.*|${key} = ${val}|" buildozer.spec
            else
              sed -i "s|^#\s*${key}\s*=.*|${key} = ${val}|" buildozer.spec
            fi
          }
          patch_spec title         "TruckLogApp"
          patch_spec package.name  "trucklogapp"
          patch_spec package.domain "org.midnightstar"
          patch_spec requirements  "python3,kivy==2.3.0,kivymd,pillow,openpyxl, et_xmlfile"
          patch_spec android.api   "34"
          patch_spec android.ndk   "25b"
          patch_spec android.build_tools_version "34.0.0"
          patch_spec android.accept_sdk_license  "True"
          patch_spec android.permissions "WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE,MANAGE_EXTERNAL_STORAGE,RECORD_AUDIO"
          patch_spec p4a.branch "master"

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: truck-log-apk
          path: bin/*.apk
