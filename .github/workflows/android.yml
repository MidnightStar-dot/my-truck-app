name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev python3-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Build APK
        run: |
          # 1. Инициализируем конфиг, если его нет
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          
          # 2. Указываем библиотеки (обязательно openpyxl для Excel)
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy==2.3.0,kivymd,pillow,openpyxl/' buildozer.spec
          
          # 3. ДАЕМ ПРАВА НА ФАЙЛЫ (чтобы видел твой Excel в Documents)
          sed -i 's/#android.permissions =/android.permissions = WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE,MANAGE_EXTERNAL_STORAGE/' buildozer.spec
          
          # 4. Настраиваем имя и чистим старые сборки
          sed -i 's/package.name = myapp/package.name = trucklogapp/' buildozer.spec
          sed -i 's/title = My Application/title = Truck Log/' buildozer.spec
          
          # 5. Запуск сборки (это займет 15-20 минут)
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: truck-log-apk
          path: bin/*.apk
